<section id="bung-market" style="background:#111; padding:20px;">
<h2 style="color:gold; text-align:center;">💎 BUNG MARKET - SANAL PARA</h2>
<p style="text-align:center; color:#aaa;">TL ile öde, BUNG kazan, oyunda harca</p>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">

<div style="background:#1e1e1e; border:2px solid gold; border-radius:15px; padding:15px; text-align:center;">
<h3>💰 120 BUNG</h3>
<p>69 TL</p>
<button onclick="pay('120bung')" style="background:gold; width:100%; padding:10px; border-radius:10px; font-weight:bold;">BUNG AL</button>
</div>

<div style="background:#1e1e1e; border:2px solid gold; border-radius:15px; padding:15px; text-align:center;">
<h3>💰 300 BUNG</h3>
<p>149 TL</p>
<button onclick="pay('300bung')" style="background:gold; width:100%; padding:10px; border-radius:10px; font-weight:bold;">BUNG AL</button>
</div>

<div style="background:#1e1e1e; border:2px solid gold; border-radius:15px; padding:15px; text-align:center;">
<h3>💎 600 BUNG</h3>
<p>279 TL</p>
<button onclick="pay('600bung')" style="background:gold; width:100%; padding:10px; border-radius:10px; font-weight:bold;">BUNG AL</button>
</div>

<div style="background:#1e1e1e; border:2px solid gold; border-radius:15px; padding:15px; text-align:center;">
<h3>👑 1500 BUNG</h3>
<p>649 TL</p>
<button onclick="pay('1500bung')" style="background:gold; width:100%; padding:10px; border-radius:10px; font-weight:bold;">BUNG AL</button>
</div>

</div>
</section>

<script>
function pay(paket){
  // PayTR linkleri buraya gelecek
  if(paket=='120bung') window.open('PAYTR_LINK_120','_blank');
  if(paket=='300bung') window.open('PAYTR_LINK_300','_blank');
  if(paket=='600bung') window.open('PAYTR_LINK_600','_blank');
  if(paket=='1500bung') window.open('PAYTR_LINK_1500','_blank');
}
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>robloxturk2027</title>
<style>body{background:#080808;color:#fff;font-family:Arial;padding:20px;max-width:500px;margin:auto}.card{background:#1e1e1e;border:2px solid #222;border-radius:18px;padding:20px;margin:12px 0;text-align:center}.price{color:#FFD700;font-size:32px;font-weight:900;margin:10px 0}.btn{background:#FFD700;color:#000;border:none;width:100%;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px}.inp{width:100%;padding:16px;border-radius:12px;border:2px solid #333;background:#111;color:#fff;margin-top:15px}#msg{display:none;padding:12px;border-radius:10px;margin-top:10px;text-align:center}</style>
</head>
<body>
<h2 style="text-align:center;color:#FFD700">💎 robloxturk2027</h2>
<div class="card"><h3>120 BUNG - 69 TL</h3><button class="btn" onclick="sec('120 BUNG - 69 TL')">SEÇ</button></div>
<div class="card"><h3>300 BUNG - 149 TL</h3><button class="btn" onclick="sec('300 BUNG - 149 TL')">SEÇ</button></div>
<div class="card"><h3>600 BUNG - 279 TL</h3><button class="btn" onclick="sec('600 BUNG - 279 TL')">SEÇ</button></div>
<input id="nick" class="inp" placeholder="Roblox Nick: vatan41">
<input id="paket" class="inp" placeholder="Seçilen Paket" readonly style="background:#222">
<button class="btn" style="background:#fff;margin-top:20px" onclick="gonder()">ÖDEME YAPTIM</button>
<div id="msg"></div>
<script>
let secili="";
https://script.google.com/macros/s/AKfycbwqfWXj4d139M_dv37Smj4ZxMemFUBahtCWS-hhK7PRdoRp17S5P_zYr4nYFQmryJo5/exec
function sec(p){secili=p;document.getElementById('paket').value=p;alert(p+' seçildi! Şimdi nick yaz ve Ödeme Yaptım de')}
async function gonder(){
 const nick=document.getElementById('nick').value;
 const m=document.getElementById('msg');
 if(!nick||!secili){alert('Kanka önce paket SEÇ ve nick yaz');return}
 m.style.display='block'; m.style.background='#333'; m.innerText='Gönderiliyor...';
 fetch(URL+"?action=ekle&nick="+encodeURIComponent(nick)+"&paket="+encodeURIComponent(secili),{mode:'no-cors'});
 setTimeout(()=>{m.style.background='#00c853'; m.innerText='✅ ALINDI! '+nick+' - '+secili;},1000);
}
</script>
</body>
</html>
